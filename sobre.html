<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="quadrado">
            <div class="tite">
                <div class="titulo">
                    <h1>O que é Mente Viva?</h1>
                </div>
                <div class="texto">
                    <p>O Mente Viva é uma plataforma de consultas psicólogas virtuais, na qual oferece
                        suporte acessível
                        e conteúdos sobre ansiedade, depressão, estressa e autoconhecimento, ajudando pessoas a entender
                        e
                        lidar melhor com suas
                        emoções.</p>
                </div>
            </div>

            <div class="tot">
                <h1 class="tit">Contato: </h1>
                <div class="form">
                    <h3>Contate-nos para mais informações: </h3>
                </div>
                <form id="formulario" class="formulario">
                    <div class="form1">
                        <label for="nome">Nome:</label>
                        <br>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>
                    <div class="form1">
                        <label for="E-mail">E-mail:</label>
                        <br>
                        <input type="text" id="nome1" name="nome" placeholder="Digite seu e-mail" required>
                    </div>
                    <div class="form1">
                        <label for="número">Número de telefone:</label>
                        <br>
                        <input type="text" id="nome2" name="nome" placeholder="Digite seu Número de telefone" required>
                        <br>
                    </div>
                    <br>
                    <button onclick="cadastradar()" class="form2">Entrar</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
